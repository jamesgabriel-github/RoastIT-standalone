<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Roastline — Bookings</title>
<script>
  // Apply the saved theme before first paint (Settings → Appearance): 'light' (default),
  // 'dark', or 'system' (match the device's light/dark setting, and follow it live).
  // In the real app this comes from MAUI Preferences. Storage can be unavailable — light.
  (function () {
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function apply() {
      var t = 'light';
      try { t = localStorage.getItem('roastline.theme') || 'light'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && !!mq && mq.matches);
      if (dark) document.documentElement.dataset.theme = 'dark';
      else delete document.documentElement.dataset.theme;
    }
    apply();
    try { if (mq) mq.addEventListener('change', apply); } catch (e) {}
    window.__applyTheme = apply;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ================= Shared mobile shell (same block in menu-prototype.html and settings-prototype.html) ================= */
  :root {
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', ui-monospace, Consolas, monospace;
    --bg: #EEEDE6;
    --surface: #FFFFFF;
    --surface-2: #F6F4EF;
    --border: #E1DDD1;
    --fg: #221E19;
    --fg-muted: #847C6D;
    --accent: #A8471F;
    --accent-fg: #FFFFFF;
    --status-pending: #8A8275;
    --status-cooking: #D9731E;
    --status-cooked: #2E8B52;
    --status-completed: #6B7280;
    --status-cancelled: #C1392B;
    --nav-h: 60px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #15120E;
    --surface: #1F1B16;
    --surface-2: #29241E;
    --border: #3A3229;
    --fg: #F2EDE4;
    --fg-muted: #A79E8F;
    --accent: #C9612F;
    --accent-fg: #FFFFFF;
    --status-pending: #A39A8A;
    --status-cooking: #E8893A;
    --status-cooked: #4CAF72;
    --status-completed: #959CA8;
    --status-cancelled: #E25B4D;
  }
  :root[data-theme="dark"] .backdrop, :root[data-theme="dark"] .dialog-backdrop { background: rgba(0,0,0,0.6); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: var(--font-body); font-size: 14px; line-height: 1.45; color: var(--fg);
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  }
  body.no-scroll { overflow: hidden; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::placeholder { color: var(--fg-muted); opacity: 1; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--fg-muted); }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  .app { min-height: 100vh; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 84px); }
  .topbar {
    position: sticky; top: 0; z-index: 20; padding-top: var(--safe-top);
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 56px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .topbar-titles { display: flex; flex-direction: column; min-width: 0; }
  .topbar h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
  .topbar .sub { font-size: 12px; color: var(--fg-muted); }
  .content { max-width: 760px; margin: 0 auto; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px; }

  .bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom); }
  .bottomnav-inner { max-width: 760px; margin: 0 auto; display: flex; }
  .navitem {
    flex: 1; min-height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11.5px; font-weight: 600; color: var(--fg-muted); text-decoration: none; background: none; border: none; padding: 6px 4px;
  }
  .navitem.active { color: var(--accent); }
  .fab {
    position: fixed; z-index: 25;
    right: max(16px, calc((100vw - 760px) / 2 + 16px));
    bottom: calc(var(--nav-h) + var(--safe-bottom) + 14px);
    height: 52px; padding: 0 20px 0 16px; border-radius: 16px; border: none;
    background: var(--accent); color: var(--accent-fg); font-size: 15px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 6px 18px rgba(168,71,31,0.35), 0 2px 4px rgba(34,30,25,0.12);
  }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 16px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; font-weight: 600;
    white-space: nowrap; touch-action: manipulation;
  }
  .btn:active { background: var(--surface-2); }
  .btn-sm { height: 38px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn-primary:active { background: color-mix(in srgb, var(--accent) 85%, black); }
  .btn-danger { color: var(--status-cancelled); border-color: color-mix(in srgb, var(--status-cancelled) 45%, var(--border)); }
  .btn-dashed { border-style: dashed; background: transparent; color: var(--fg-muted); }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid transparent; background: transparent; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-btn:active { background: var(--surface-2); }

  .search { position: relative; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--fg-muted); }
  .input { width: 100%; height: 46px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); padding: 0 12px; font-size: 16px; }
  .search .input { padding-left: 40px; }
  textarea.input { height: auto; min-height: 96px; padding: 12px; resize: vertical; line-height: 1.45; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 12.5px; font-weight: 600; color: var(--fg-muted); }
  .field-label .opt { font-weight: 400; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .chip-row { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; }
  .chip { flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--fg-muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .list-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; }
  .list-meta-actions { display: flex; gap: 6px; min-width: 0; }
  .meta-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface-2); font-size: 12.5px; font-weight: 600; white-space: nowrap; min-width: 0;
  }
  .meta-btn span { overflow: hidden; text-overflow: ellipsis; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .pill-dot { width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0; }
  .empty { border: 1px dashed var(--border); border-radius: 12px; padding: 36px 16px; text-align: center; color: var(--fg-muted); font-size: 13.5px; }

  .backdrop { position: fixed; inset: 0; background: rgba(20,16,12,0.42); z-index: 50; animation: fade 0.15s ease; }
  .sheet { position: fixed; z-index: 51; background: var(--surface); display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(20,16,12,0.18); }
  .sheet.full { inset: 0; animation: slideUp 0.2s ease; }
  .sheet.bottom { left: 0; right: 0; bottom: 0; max-height: 88vh; border-radius: 18px 18px 0 0; animation: slideUp 0.2s ease; }
  .sheet.top-layer { z-index: 61; }
  .backdrop.top-layer { z-index: 60; }
  .sheet-grabber { width: 38px; height: 4px; border-radius: 999px; background: var(--border); margin: 8px auto 0; flex-shrink: 0; }
  .sheet-header { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; min-height: 56px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .sheet.full .sheet-header { padding-top: calc(6px + var(--safe-top)); padding-left: 6px; }
  .sheet-title { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 16px; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; }
  .sheet.bottom .sheet-body { padding-bottom: calc(16px + var(--safe-bottom)); }
  .sheet-footer { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 16px calc(12px + var(--safe-bottom)); border-top: 1px solid var(--border); background: var(--surface); }
  .sheet-footer .btn { flex: 1; }
  @media (min-width: 768px) {
    .sheet.full { left: auto; width: 440px; border-left: 1px solid var(--border); animation: slideLeft 0.2s ease; }
    .sheet.full .sheet-header { padding-top: 6px; }
    .sheet.bottom { left: 50%; right: auto; bottom: 24px; width: 420px; transform: translateX(-50%); border-radius: 18px; animation: fade 0.15s ease; }
    .sheet.bottom .sheet-grabber { display: none; }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(28px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  @keyframes slideLeft { from { transform: translateX(28px); opacity: 0.6; } to { transform: none; opacity: 1; } }

  .menu-row {
    display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 6px; border-radius: 10px; width: 100%;
    color: var(--fg); text-decoration: none; font-size: 15px; font-weight: 600; background: none; border: none; text-align: left;
  }
  .menu-row:active { background: var(--surface-2); }
  .menu-row .trail { margin-left: auto; color: var(--fg-muted); display: flex; }
  .menu-row.selected { color: var(--accent); }
  .group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); margin: 0; }
  .segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 3px; }
  .seg { height: 38px; border-radius: 8px; border: none; background: transparent; font-size: 13.5px; font-weight: 600; color: var(--fg-muted); }
  .seg.active { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(34,30,25,0.14); }
  .caption { font-size: 12.5px; color: var(--fg-muted); margin: 0; }
  .form-error { font-size: 13px; color: var(--status-cancelled); font-weight: 600; margin: 0; }
  .switch { position: relative; width: 50px; height: 30px; border-radius: 999px; border: none; background: var(--border); flex-shrink: 0; padding: 0; }
  .switch.on { background: var(--accent); }
  .switch span { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: left 0.15s ease; }
  .switch.on span { left: 23px; }
  .toggle-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 80;
    bottom: calc(var(--nav-h) + var(--safe-bottom) + 80px);
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 500;
    box-shadow: 0 8px 20px rgba(34,30,25,0.22); max-width: calc(100vw - 32px); animation: fade 0.15s ease;
  }
  .toast.over-footer { bottom: calc(var(--safe-bottom) + 84px); }
  /* ================= end shared shell ================= */

  /* ---- Bookings page ---- */
  .datebar { display: flex; align-items: stretch; gap: 8px; }
  .all-chip { flex-shrink: 0; width: 48px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 700; }
  .all-chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .strip { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; padding: 7px 2px 3px; margin: -7px 0 -3px; scroll-snap-type: x proximity; }
  .day {
    position: relative; flex: 0 0 46px; height: 56px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; scroll-snap-align: start;
  }
  .day.today { border-color: var(--accent); }
  .day.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .day-wd { font-size: 10px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; opacity: 0.75; }
  .day-num { font-family: var(--font-mono); font-size: 16px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .day-badge {
    position: absolute; top: -6px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
    background: var(--accent); color: var(--accent-fg); font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .day.selected .day-badge { background: var(--accent-fg); color: var(--accent); }
  .strip-arrow { scroll-snap-align: start; flex: 0 0 34px; height: 56px; border-radius: 12px; border: 1px dashed var(--border); background: transparent; color: var(--fg-muted); display: flex; align-items: center; justify-content: center; }
  .strip-arrow[disabled] { opacity: 0.35; cursor: not-allowed; }
  .cal-btn { flex-shrink: 0; width: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
  .cal-btn.has-date { border-color: var(--accent); color: var(--accent); }
  .scope { font-size: 13px; color: var(--fg-muted); }
  .scope strong { color: var(--fg); }

  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .card-title { margin: 0; font-size: 14.5px; font-weight: 700; }
  .card-cap { font-size: 12px; color: var(--fg-muted); }
  .kpi-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kpi:first-child { grid-column: 1 / -1; }
  .kpi-label { font-size: 12px; color: var(--fg-muted); font-weight: 500; }
  .kpi-value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  @media (min-width: 640px) {
    .kpi-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .kpi:first-child { grid-column: auto; }
    .kpi-value { font-size: 17px; }
  }
  .stack-bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .mix-list { display: flex; flex-direction: column; gap: 12px; }
  .mix-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; align-items: center; font-size: 13.5px; }
  .mix-bar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .mix-bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .bal-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
  .bal-row:first-child { border-top: none; padding-top: 0; }
  .bal-name { font-weight: 600; font-size: 14px; }
  .kchart { display: flex; align-items: flex-start; min-width: 0; }
  .kchart svg { display: block; flex: none; }
  .kchart-scroll { flex: 1 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; padding-bottom: 6px; }
  .kchart-cap { font-size: 10.5px; color: var(--fg-muted); text-align: center; margin-top: 2px; }
  .kbar { fill: var(--status-cooking); opacity: 0.78; }
  .kbar.sel { opacity: 1; fill: var(--accent); }
  .khit { fill: transparent; cursor: pointer; }
  .ktick { font-family: var(--font-mono); font-size: 10.5px; fill: var(--fg-muted); }
  .kcount { font-family: var(--font-mono); font-size: 11px; font-weight: 600; fill: var(--fg); }
  .kgrid { stroke: var(--border); stroke-width: 1; }
  .kaxis { stroke: var(--fg-muted); stroke-width: 1; }
  .know { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; pointer-events: none; }
  .kreadout { margin-top: 8px; font-size: 12.5px; color: var(--fg-muted); min-height: 18px; }
  .kreadout b { color: var(--fg); }

  .bcard-list { display: flex; flex-direction: column; gap: 10px; }
  .group-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 2px 0; font-size: 13px; font-weight: 700; }
  .group-head .muted { font-weight: 500; font-size: 12.5px; }
  .today-pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); margin-left: 6px; vertical-align: 1px; }
  .bcard { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .bcard:active { background: var(--surface-2); }
  .bcard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bid { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--fg-muted); }
  .bcard-product { font-size: 15px; font-weight: 700; }
  .bcard-product .muted { font-weight: 500; font-size: 13px; }
  .bcard-line { display: flex; align-items: center; gap: 7px; font-size: 13px; min-width: 0; }
  .bcard-line svg { color: var(--fg-muted); flex-shrink: 0; }
  .bcard-line span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bcard-money { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
  .bcard-money b { font-family: var(--font-mono); font-weight: 600; }
  .was { color: var(--fg-muted); font-size: 12px; text-decoration: line-through; font-family: var(--font-mono); }
  .bcard-actions { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }
  .bcard-actions .btn { flex: 1; }
  .bcard-list.compact { gap: 6px; }
  .crow {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 12px 0 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; text-align: left;
  }
  .crow:active { background: var(--surface-2); }
  .crow .bid { color: var(--fg); font-size: 14px; flex: 1; min-width: 0; }
  .crow-time { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
  .crow-time svg, .crow-chev { color: var(--fg-muted); flex-shrink: 0; display: flex; }
  .bcard.expanded { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .bcard-top-right { display: flex; align-items: center; gap: 4px; }
  /* "1 of 2" tag after the booking ID for multi-booking orders */
  .order-tag {
    display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; vertical-align: 1px;
    font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--fg-muted);
    background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap;
  }

<body>
<div id="app"></div>

<script>
/* =====================================================================================
   Roastline — Bookings page, standalone mobile prototype
   -------------------------------------------------------------------------------------
   Same data model, view-model math and rules as the web bookings-prototype.html /
   bookings-page-spec.md, re-laid-out for a phone:

   - Top bar + bottom navigation (Bookings · Menu · Settings) + floating "New booking".
   - Date strip: "All" + a swipeable 10-day window with prev/next-week ends + calendar
     bottom sheet. ±6-month schedulable window still enforced inside selectDate().
   - Dashboard / List as a segmented control; both read the same selectedDate.
   - Booking list = cards instead of a table, with a Detailed / Compact switch. Compact shows
     only booking ID + pickup time; tapping a row expands it into the full card. Which fields a card shows (was: the Columns
     menu) is now chosen in Settings → "Columns to show".
     Tapping a card opens the detail; the card's quick-advance button still asks for
     confirmation, the detail sheet's advance button is still immediate.
   - Automatic CSV backup: one file, "roastline-bookings-48h.csv" — bookings with pickup from
     24 h before to 24 h after the save, rewritten hourly while the app is open. Shown in Settings.
   - Recording a payment, "Discount remaining balance" and cancelling ask for the PIN first; a
     correct PIN is remembered for 3 minutes for these Bookings actions.
   - Cancelling always cancels the whole order (all its items), and only while none of them
     is cooked or completed.
   - Detail and New booking open as full-screen sheets (side panel on tablets).
   - New booking's pickup is split into a Date part and a Time part. Date: a button that
     opens the calendar sheet (dots = days with bookings) plus Today / Tomorrow chips.
     Time: hour combo box (1–12) : minutes typed as 00–59 : AM/PM (minutes are tidied on
     leaving the field: "7" → 07, "75" → 59).
     A summary line reads the pickup back in words, and warns if the time has passed.
   - Creating a booking shows a "Booking created" popup with the new booking ID(s). It has
     no timer and tapping outside doesn't close it: the user closes it with Done (or Back).
   - Booking cards show the ORDER's money ("Order ₱4,400 · Paid ₱2,000"), so a booking
     from a multi-booking order carries a "1 of 2" tag after its ID (numbered by booking
     ID, cancelled included) to show the figures are shared with other cards.
   - Kitchen load (D31): a fixed 12 AM – 11:59 PM axis for the selected date, 40 px per
     hour with a label under every hour, so the plot scrolls sideways while the y-axis
     labels stay put. Today shows a dashed "now" line and opens centred on it; other
     dates open an hour before the first busy bar. Tap a bar to read its time window
     (no hover on touch).

   Rendering: full re-render on clicks (scroll positions preserved); typing only
   redraws the regions that depend on it, so the keyboard never closes mid-typing.
   ===================================================================================== */

  // ---------------------------------------------------------------------------------
  // Constants & data model (unchanged from the web prototype)
  // ---------------------------------------------------------------------------------
  const TODAY = '2026-10-09';
  const TODAY_YYMMDD = '261009';

  const PRODUCTS = [
    { name: 'Lechon Head',    cookingTimeMin: 180, price: 1200 },
    { name: 'Lechon Turkey',  cookingTimeMin: 150, price: 4500 },
    { name: 'Lechon Chicken', cookingTimeMin: 30,  price: 750 },
    { name: 'Lechon Belly',   cookingTimeMin: 120, price: 2200 },
    { name: 'Liempo',         cookingTimeMin: 45,  price: 650 }
  ];
  const PRODUCT_BY_NAME = {};
  PRODUCTS.forEach((p) => { PRODUCT_BY_NAME[p.name] = p; });
  const PRODUCT_NAMES = PRODUCTS.map((p) => p.name);

  const STATUS_META = {
    pending:   { label: 'Pending',   css: 'var(--status-pending)' },
    cooking:   { label: 'Cooking',   css: 'var(--status-cooking)' },
    cooked:    { label: 'Cooked',    css: 'var(--status-cooked)' },
    completed: { label: 'Completed', css: 'var(--status-completed)' },
    cancelled: { label: 'Cancelled', css: 'var(--status-cancelled)' }
  };
  const STATUS_ORDER = ['pending', 'cooking', 'cooked', 'completed', 'cancelled'];
  const NEXT_STATUS = { pending: 'cooking', cooking: 'cooked', cooked: 'completed' };
  const NEXT_ACTION_LABEL = { pending: 'Start cooking', cooking: 'Mark cooked', cooked: 'Mark completed' };
  const STATUS_CHIP_ORDER = ['all', 'pending', 'cooking', 'cooked', 'completed', 'cancelled'];

  const SORT_FIELDS = [
    { key: 'pickup',      label: 'Pickup time',  ascLabel: 'Soonest first',       descLabel: 'Latest first' },
    { key: 'status',      label: 'Status',       ascLabel: 'Pending → Completed', descLabel: 'Completed → Pending' },
    { key: 'bookingId',   label: 'Booking ID',   ascLabel: 'A → Z',                descLabel: 'Z → A' },
    { key: 'customer',    label: 'Customer',     ascLabel: 'A → Z',                descLabel: 'Z → A' },
    { key: 'product',     label: 'Product',      ascLabel: 'A → Z',                descLabel: 'Z → A' },
    { key: 'cookingTime', label: 'Cooking time', ascLabel: 'Shortest first',       descLabel: 'Longest first' }
  ];
  const SORT_FIELD_BY_KEY = {};
  SORT_FIELDS.forEach((f) => { SORT_FIELD_BY_KEY[f.key] = f; });

  // Optional fields shown on each booking card (was: table columns). Chosen in Settings →
  // "Columns to show" and saved per device (MAUI Preferences in the real app).
  const COLUMN_FIELDS = [
    { key: 'customer',    label: 'Customer' },
    { key: 'product',     label: 'Product' },
    { key: 'cookingTime', label: 'Cooking time' },
    { key: 'pickup',      label: 'Pickup' },
    { key: 'status',      label: 'Status' },
    { key: 'total',       label: 'Order total' },
    { key: 'paid',        label: 'Order paid' }
  ];

  // ---------------------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------------------
  function makeBookingId(seq) { return TODAY_YYMMDD + '-' + String(seq).padStart(3, '0'); }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function addDays(dateStr, delta) {
    const p = dateStr.split('-');
    const dt = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10) + delta);
    return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate());
  }
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function addMonths(dateStr, delta) {
    const p = dateStr.split('-');
    const dt = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1 + delta, parseInt(p[2], 10));
    return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate());
  }
  const SCHEDULE_RANGE_MONTHS = 6;
  const MIN_SCHEDULABLE_DATE = addMonths(TODAY, -SCHEDULE_RANGE_MONTHS);
  const MAX_SCHEDULABLE_DATE = addMonths(TODAY, SCHEDULE_RANGE_MONTHS);
  function isDateSchedulable(d) { return d >= MIN_SCHEDULABLE_DATE && d <= MAX_SCHEDULABLE_DATE; }
  function clampStripStart(d) {
    const maxStart = addDays(MAX_SCHEDULABLE_DATE, -9);
    if (d < MIN_SCHEDULABLE_DATE) return MIN_SCHEDULABLE_DATE;
    if (d > maxStart) return maxStart;
    return d;
  }
  function clampMonth(ym) {
    const minM = MIN_SCHEDULABLE_DATE.slice(0, 7), maxM = MAX_SCHEDULABLE_DATE.slice(0, 7);
    if (ym < minM) return minM;
    if (ym > maxM) return maxM;
    return ym;
  }
  function weekdayOf(d) {
    const p = d.split('-');
    return WEEKDAYS[new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).getDay()];
  }
  function formatDuration(min) {
    if (min < 60) return min + ' min';
    const h = Math.floor(min / 60), m = min % 60;
    return h + ' hr' + (m ? ' ' + m + ' min' : '');
  }
  function dateOnly(iso) { return iso ? iso.slice(0, 10) : ''; }
  function formatDate(d) {
    if (!d) return '—';
    const p = d.split('-');
    return MONTHS[parseInt(p[1], 10) - 1] + ' ' + parseInt(p[2], 10);
  }
  function formatDateShort(d) {
    if (!d) return '—';
    const p = d.split('-');
    return MONTHS[parseInt(p[1], 10) - 1] + ' ' + parseInt(p[2], 10) + ', ' + parseInt(p[0], 10);
  }
  function formatDateHeader(d) {
    if (!d) return 'No date set';
    const p = d.split('-');
    const y = parseInt(p[0], 10), m = parseInt(p[1], 10), day = parseInt(p[2], 10);
    return WEEKDAYS[new Date(y, m - 1, day).getDay()] + ', ' + MONTHS[m - 1] + ' ' + day + ', ' + y;
  }
  function formatScopeDate(d) {
    if (d === TODAY) return 'Today';
    if (d === addDays(TODAY, -1)) return 'Yesterday';
    if (d === addDays(TODAY, 1)) return 'Tomorrow';
    return formatDateHeader(d);
  }
  function formatTime(iso) {
    if (!iso) return '—';
    const t = iso.split('T')[1];
    if (!t) return '—';
    const bits = t.split(':');
    let h = parseInt(bits[0], 10);
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + bits[1] + ' ' + ampm;
  }
  function formatDateTime(iso) { return iso ? formatDate(dateOnly(iso)) + ' · ' + formatTime(iso) : '—'; }
  function formatMoney(n) { return '₱' + Math.round(n).toLocaleString('en-PH'); }
  function customerLabel(order) {
    if (!order) return '—';
    return order.customer && order.customer.trim() ? order.customer : 'Walk-in customer';
  }
  function netTotal(order) {
    if (!order) return 0;
    return order.totalAmount - Math.min(order.discountAmount || 0, order.totalAmount);
  }

  function parseDateTime(iso) {

  };
  function pinKeydown(e) {
    if (/^[0-9]$/.test(e.key)) { PinActions.key(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { PinActions.back(); e.preventDefault(); }
    else if (e.key === 'Enter') { PinActions.submit(); e.preventDefault(); }
    else if (e.key === 'Escape') { PinActions.cancel(); e.preventDefault(); }
  }
  function renderPinPrompt() {
    const p = state.pinPrompt;
    if (!p) return '';
    const locked = pinLocked();
    const dis = locked ? 'disabled' : '';
    const dots = p.entry.length === 0
      ? '<span class="pin-hint">Enter your PIN</span>'
      : Array.from({ length: p.entry.length }, () => '<span class="pin-dot"></span>').join('');
    const msg = locked ? 'Too many tries. Try again in ' + pinSecondsLeft() + 's.' : p.message;
    const digits = ['1','2','3','4','5','6','7','8','9'].map((d) => `<button type="button" class="pin-key" data-action="pin-key" data-digit="${d}" ${dis}>${d}</button>`).join('');
    const html = `
      <div class="backdrop pin-layer" data-action="pin-cancel"></div>
      <div class="sheet bottom pin-layer" role="dialog" aria-modal="true" aria-labelledby="pin-title">
        <div class="sheet-grabber"></div>
        <div class="pin-body">
          <div class="pin-head">
            <span class="pin-icon">${icon('<rect x="4" y="9" width="12" height="8.5" rx="2"></rect><path d="M6.5 9V6.5a3.5 3.5 0 017 0V9"></path>', 20)}</span>
            <h2 id="pin-title">Enter your PIN to continue</h2>
            <p class="pin-detail">${esc(p.detail)}</p>
            ${p.rememberMs ? `<p class="pin-detail" style="font-size:12px;">Payments, write-offs and cancellations won't ask again for ${Math.round(p.rememberMs / 60000)} minutes.</p>` : ''}
          </div>
          <div class="pin-dots ${p.shake ? 'pin-shake' : ''}" aria-live="polite" aria-label="${p.entry.length} digits entered">${dots}</div>
          <div class="pin-msg" role="alert">${esc(msg)}</div>
          <div class="pin-keypad" role="group" aria-label="PIN keypad">
            ${digits}
            <button type="button" class="pin-key fn" data-action="pin-back" aria-label="Delete" ${dis}>${icon('<path d="M7 5h9.5v10H7l-4.5-5z"></path><line x1="10" y1="8" x2="14" y2="12"></line><line x1="14" y1="8" x2="10" y2="12"></line>', 22)}</button>
            <button type="button" class="pin-key" data-action="pin-key" data-digit="0" ${dis}>0</button>
            <button type="button" class="pin-key ok" data-action="pin-ok" ${locked || p.entry.length < PIN_MIN ? 'disabled' : ''}>${esc(p.confirmLabel)}</button>
          </div>
          <button type="button" class="btn pin-cancel" data-action="pin-cancel">Cancel</button>

    if (p.shake) setTimeout(() => { if (state.pinPrompt) state.pinPrompt.shake = false; }, 400);
